<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Redirecting to lamama9.github.io/dogger</title>
<script>
(function () {
  // This exact path (/dogger-legal-pages/app/) is a real file (this one), not a 404, so the
  // root 404.html's redirect never fires for it - this page does the same forwarding for that one
  // case, preserving whatever comes after "app" plus the query string and hash fragment untouched.
  var m = location.pathname.match(/^\/dogger-legal-pages\/app(\/.*)?$/);
  var rest = (m && m[1]) || '/';
  location.replace('/dogger' + rest + location.search + location.hash);
})();
</script>
</head>
<body>
<p>Redirecting to <a href="/dogger/">lamama9.github.io/dogger</a>&hellip;</p>
<noscript>
  <a href="/dogger/">Continue to the app</a>
</noscript>
</body>
</html>
