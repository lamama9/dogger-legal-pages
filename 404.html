<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found</title>
</head>
<body>
<p id="msg">Page not found.</p>
<script>
(function () {
  // The Dogger app's web build moved from /dogger-legal-pages/app to /dogger/. Old, already-
  // installed Android builds (0.3.45 and earlier) still send email confirmation/password-reset
  // links pointing at the old path (see auth-repository.ts's authDeepLinkRedirect doc comment), so
  // any missing path under /dogger-legal-pages/app is forwarded to its new home under /dogger,
  // preserving whatever comes after "app" plus the query string and hash fragment untouched (the
  // hash in particular carries GoTrue's access_token/refresh_token, which must survive intact).
  //
  // This repo also still hosts privacy.html / delete-account.html / style.css (Google Play policy
  // URLs) at its root - any OTHER missing path (a typo, an old bookmark to something that never
  // existed here) is left showing the plain "Page not found" text above, not redirected anywhere.
  var m = location.pathname.match(/^\/dogger-legal-pages\/app(\/.*)?$/);
  if (m) {
    var rest = m[1] || '/';
    location.replace('/dogger' + rest + location.search + location.hash);
  }
})();
</script>
</body>
</html>
